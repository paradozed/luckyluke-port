# Mount point containing the original Lucky Luke CD contents.
# It should contain directories such as CINEMA/ and win/.
# Change this if your CD or mounted ISO is available elsewhere.
cd_mount=/run/media/nicolas/LuckyLuke

# Skip the startup Aqua Pacific and localized logos when true.
skip_intro=true

# Enable/disable sound output. Menu digital effects use the original BIZ bank.
sound=true

# Window resolution. The current menu/game projection uses a 4:3 layout.
# Supported dimensions: 640x480 through 3840x2880, preserving 4:3 aspect.
resolution=640x480

# Localized game resources: e, f, d, s, i, u, or b.
language=f
